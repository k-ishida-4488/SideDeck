<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; margin: 0; padding: 12px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 10px; }
    .header h2 { font-size: 16px; color: #1e40af; margin: 0; font-weight: 800; }
    .task-counter { font-size: 10px; background: #dbeafe; color: #1e40af; padding: 3px 8px; border-radius: 20px; font-weight: bold; }
    button { cursor: pointer; border: none; border-radius: 6px; padding: 6px 10px; font-weight: bold; font-size: 11px; font-family: inherit; }
    .top-action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
    .main-dropdown-btn { background: #2563eb; color: #fff; padding: 8px; text-align: center; border-radius: 6px; font-weight: bold; width: 100%; }
    .main-dropdown-btn.secondary { background: #fff; color: #1e40af; border: 1px solid #bfdbfe; }
    .dropdown-panel { display: none; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px; margin-bottom: 8px; }
    .dropdown-panel.open { display: block; }
    .sub-btn-list { display: flex; flex-direction: column; gap: 4px; }
    .sub-item-btn { width: 100%; text-align: left; padding: 6px 10px; background: #f1f5f9; color: #334155; border-radius: 4px; font-size: 11px; }
    .sub-item-btn.danger { color: #dc2626; background: #fef2f2; }
    .sub-utility-row { display: flex; gap: 4px; margin-bottom: 10px; }
    .utility-btn { flex: 1; background: #fff; color: #64748b; border: 1px solid #e2e8f0; font-size: 10px; padding: 5px; border-radius: 4px; text-align: center; }
    .image-drop-zone { border: 1.5px dashed #93c5fd; background: #eff6ff; border-radius: 6px; padding: 6px; text-align: center; font-size: 10px; color: #2563eb; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
    .inline-form { display: none; background: #fff; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #cbd5e1; }
    .inline-form.open { display: block; }
    .inline-form input[type="text"], .inline-form textarea, .inline-form select { width: 94%; padding: 6px; font-size: 11px; background: #fff; color: #0f172a; border: 1px solid #cbd5e1; border-radius: 4px; margin-bottom: 6px; outline: none; }
    .inline-form-actions { display: flex; justify-content: flex-end; gap: 6px; }
    .category-section { margin-bottom: 10px; transition: opacity 0.15s; }
    .category-section.dragging-cat { opacity: 0.4; border: 1px dashed #2563eb; }
    .category-header { font-size: 11px; font-weight: bold; color: #1e40af; background: #dbeafe; padding: 5px 8px; border-radius: 5px; cursor: grab; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; border: 1px solid #bfdbfe; user-select: none; }
    .category-header.fixed-cat { cursor: pointer; background: #e2e8f0; color: #334155; border-color: #cbd5e1; }
    .category-content.collapsed { display: none; }
    .cat-tags-wrap { display: inline-flex; gap: 4px; flex-wrap: wrap; cursor: pointer; border-radius: 4px; padding: 2px; }
    .cat-tag { font-size: 9px; background: #e0e7ff; color: #3730a3; padding: 1px 5px; border-radius: 3px; font-weight: bold; border: 1px solid #c7d2fe; }
    .card-cat-multi-box { background: #fff; border: 1px solid #2563eb; border-radius: 6px; padding: 8px; margin-top: 4px; font-size: 11px; text-align: left; }
    .card-cat-checkbox-list { max-height: 120px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; }
    .card-cat-checkbox-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #334155; cursor: pointer; }
    .task-card { background: #fff; border-radius: 8px; padding: 10px; margin-bottom: 8px; border-left: 4px solid #2563eb; border-top: 1px solid #f1f5f9; border-right: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; cursor: grab; }
    .task-card.important { border-left-color: #f59e0b; background: #fffbeb; }
    .row-1 { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
    .row-2 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; border-bottom: 1px dashed #e2e8f0; padding-bottom: 4px; }
    .row-3 { margin-bottom: 4px; }
    .row-4 { font-size: 11px; color: #334155; }
    .badge { font-size: 9px; background: #3b82f6; color: #fff; padding: 1px 6px; border-radius: 10px; font-weight: 600; }
    .badge.gmail { background: #ef4444; } .badge.teams { background: #6366f1; } .badge.chat { background: #10b981; }
    .time-badge { font-size: 9px; color: #64748b; background: #f1f5f9; padding: 1px 5px; border-radius: 3px; font-weight: bold; }
    .time-badge.completed { background: #d1fae5; color: #047857; }
    .task-subject { font-size: 13px; font-weight: 700; color: #0f172a; outline: none; border-radius: 4px; cursor: pointer; }
    .due-badge { font-size: 10px; font-weight: bold; display: inline-block; padding: 1px 5px; border-radius: 3px; background: #f1f5f9; color: #475569; }
    .due-badge.today { background: #f59e0b; color: #fff; } .due-badge.overdue { background: #ef4444; color: #fff; }
    .gcal-btn { background: #2563eb; color: #fff; text-decoration: none; padding: 2px 5px; border-radius: 3px; font-size: 10px; font-weight: bold; }
    .action-group { display: flex; gap: 3px; align-items: center; flex-wrap: wrap; }
    .icon-btn { background: #f1f5f9; color: #475569; padding: 2px 5px; font-size: 10px; border-radius: 3px; border: 1px solid #cbd5e1; }
    .danger-btn { color: #ef4444; border-color: #fca5a5; }
    .date-input-hidden { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
    .task-title { font-size: 11px; color: #334155; padding: 2px; outline: none; line-height: 1.4; white-space: pre-wrap; word-break: break-all; }
    .task-title.collapsed { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .task-image-preview { max-width: 100%; border-radius: 4px; margin-top: 4px; border: 1px solid #cbd5e1; cursor: pointer; }
    .toggle-expand-btn { background: none; color: #2563eb; padding: 1px 0; font-size: 10px; font-weight: bold; }
    .history-section { margin-top: 16px; border-top: 1px solid #e2e8f0; padding-top: 8px; }
    .history-header { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 6px; }
    .history-toggle { background: #64748b; color: #fff; flex-grow: 1; text-align: left; border-radius: 4px; padding: 4px 8px; font-size: 11px; }
    .history-list { display: none; } .history-list.open { display: block; }
    .completed-card { opacity: 0.8; border-left-color: #94a3b8; }
  </style>
  <script src="tesseract.min.js"></script>
</head>
<body>
  <div class="header"><h2>SideDeck</h2><span id="task-counter" class="task-counter">未完了: 0件</span></div>
  <div class="top-action-grid">
    <button id="btn-open-add-panel" class="main-dropdown-btn">➕ チケット追加 ▼</button>
    <button id="btn-open-cat-panel" class="main-dropdown-btn secondary">📁 カテゴリ管理 ▼</button>
  </div>
  <div id="panel-add-sub" class="dropdown-panel">
    <div class="sub-btn-list">
      <button id="add-manual-trigger-btn" class="sub-item-btn">✏️ 手動でテキスト入力</button>
      <button id="paste-add-btn" class="sub-item-btn">📋 クリップボード文字から追加</button>
    </div>
  </div>
  <div id="inline-form" class="inline-form">
    <input type="text" id="manual-subject-input" placeholder="件名（タイトル）を入力..." />
    <textarea id="manual-task-input" rows="2" placeholder="詳しい本文を入力..."></textarea>
    <select id="manual-category-select"><option value="">-- 既存カテゴリから選択 (任意) --</option></select>
    <input type="text" id="manual-category-input" placeholder="新規カテゴリ手入力 (例: 仕事, 買物)" />
    <div class="inline-form-actions">
      <button id="manual-submit-btn" class="icon-btn" style="background:#2563eb; color:#fff; font-weight:bold;">追加</button>
      <button id="manual-cancel-btn" class="icon-btn">キャンセル</button>
    </div>
  </div>
  <div id="panel-cat-sub" class="dropdown-panel">
    <div class="sub-btn-list">
      <button id="create-cat-btn" class="sub-item-btn">➕ 新規カテゴリの作成</button>
      <button id="delete-cat-btn" class="sub-item-btn danger">🗑️ 登録済みカテゴリの削除</button>
    </div>
  </div>
  <div id="delete-cat-form" class="inline-form">
    <div style="font-size: 11px; font-weight: bold; color: #dc2626; margin-bottom: 6px;">🗑️ 削除するカテゴリを選んでください</div>
    <select id="delete-category-select"><option value="">-- カテゴリを選択 --</option></select>
    <div class="inline-form-actions">
      <button id="delete-cat-submit-btn" class="icon-btn danger-btn">削除実行</button>
      <button id="delete-cat-cancel-btn" class="icon-btn">キャンセル</button>
    </div>
  </div>
  <div class="sub-utility-row">
    <button id="sort-due-btn" class="utility-btn">⚡ 締切順ソート</button>
    <button id="export-btn" class="utility-btn">💾 保存</button>
    <button id="import-btn" class="utility-btn">📂 復元</button>
    <input type="file" id="import-file-input" style="display: none;" accept=".json" />
  </div>
  <div id="image-drop-zone" class="image-drop-zone">📷 画像は Ctrl+V または ここへドロップ</div>
  <div id="task-container"></div>
  <div class="history-section">
    <div class="history-header">
      <button id="history-toggle-btn" class="history-toggle">完了履歴(0件) v</button>
      <button id="clear-history-btn" class="icon-btn danger-btn" title="履歴を全削除">全削除</button>
    </div>
    <div id="history-container" class="history-list"></div>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
